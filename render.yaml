services:
  - type: web
    name: insurance-quoting-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      # WhatsApp Cloud API credentials — set these manually in the Render
      # dashboard once Meta is connected. sync: false means Render will
      # never expect or overwrite a value from this file.
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
